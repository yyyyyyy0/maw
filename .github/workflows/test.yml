name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Validate changelog release headings are unique
        run: |
          release_headers="$(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md || true)"
          dups="$(printf '%s\n' "$release_headers" | sed '/^$/d' | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "Duplicate release headings found:"
            echo "$dups"
            exit 1
          fi
          echo "No duplicate release headings."

      - name: Run core bats tests
        run: bats tests/maw_test.bats

      - name: Run CLI E2E bats tests
        run: bats tests/e2e_test.bats

      - name: Run security bats tests
        run: bats tests/security_test.bats

      - name: Run doctor multi mode check
        run: ./bin/maw doctor --json --exit-code-mode multi
