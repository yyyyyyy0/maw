name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Test version
        run: |
          output="$(bin/maw --version)"
          [[ "$output" =~ ^maw\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Test help
        run: bin/maw --help | grep -q "Usage:"

      - name: Test init -> spawn -> handover -> takeover flow
        run: |
          MAW_BIN="$GITHUB_WORKSPACE/bin/maw"
          cd /tmp && TEST_DIR=$(mktemp -d) && cd "$TEST_DIR"
          git init --initial-branch=main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo '{}' > package.json && echo '# test' > yarn.lock
          git add . && git commit -m "initial"

          "$MAW_BIN" init
          "$MAW_BIN" spawn test_ws --agent claude --issue 1 --from main
          "$MAW_BIN" handover --workspace test_ws
          "$MAW_BIN" takeover test_ws --format plan | jq '.workspace'

      - name: Test doctor JSON
        run: |
          MAW_BIN="$GITHUB_WORKSPACE/bin/maw"
          cd /tmp && TEST_DIR=$(mktemp -d) && cd "$TEST_DIR"
          git init --initial-branch=main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo '{}' > package.json && git add . && git commit -m "init"

          "$MAW_BIN" init
          "$MAW_BIN" doctor --json | jq '.version'
